<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Moments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .header h1 { 
            font-size: 1.8rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #16161a;
            border: 1px solid #282830;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 65, 108, 0.15);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- EDIT 1: CUSTOMER NAMES -->
        <h1>Giovani & Jaslyne ❤️</h1>
    </div>

    <div class="card">
        <video controls playsinline controlsList="nodownload">
            <!-- EDIT 2: VIDEO FILENAME AT THE END -->
            <source src="https://moments-11a.pages.dev/videos/20261004_201139000_iOS.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

</body>
</html>
